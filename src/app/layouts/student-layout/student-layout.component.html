<div class="student-shell" [class.menu-open]="menuOpen()">
  <aside>
    <div class="brand"><strong>SAM</strong><span>Smart Attendance Management</span></div>
    <nav (click)="menuOpen.set(false)">
      <a routerLink="/student/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"><sam-icon name="home" />Dashboard</a>
      <a routerLink="/student/sessions" routerLinkActive="active"><sam-icon name="calendar" />Attendance Sessions</a>
      <a routerLink="/student/scan" routerLinkActive="active"><sam-icon name="scan" />Scan Attendance</a>
      <a routerLink="/student/attendance" routerLinkActive="active"><sam-icon name="clock" />My Attendance</a>
      <a routerLink="/student/timetable" routerLinkActive="active"><sam-icon name="calendar" />Timetable</a>
      <a routerLink="/student/courses" routerLinkActive="active"><sam-icon name="book" />Courses</a>
      <a routerLink="/student/profile" routerLinkActive="active"><sam-icon name="user" />Profile</a>
    </nav>
    <div class="motivation">
      <img class="robot" src="/images/student-robot.png" alt="Friendly attendance robot holding a phone">
      <strong>Stay on track!</strong>
      <p>Don’t miss your sessions.<br>Regular attendance builds your success.</p>
    </div>
  </aside>
  <button class="scrim" (click)="menuOpen.set(false)" aria-label="Close menu"></button>
  <section class="workspace">
    <header>
      <button class="menu-button" (click)="menuOpen.set(true)" aria-label="Open menu"><sam-icon name="menu" /></button>
      <div class="welcome"><span>Welcome back,</span><strong>{{ student.profile()?.firstName || auth.user()?.firstName || 'Student' }}</strong></div>
      <button class="profile" (click)="auth.logout()" title="Log out">
        <span class="avatar">{{ student.profile()?.firstName?.charAt(0) || auth.user()?.firstName?.charAt(0) || 'S' }}</span>
        <strong>{{ student.profile()?.firstName || auth.user()?.firstName || 'Student' }}</strong>
        <sam-icon name="chevron" size="18"/>
      </button>
    </header>
    <main><router-outlet /></main>
  </section>
</div>
